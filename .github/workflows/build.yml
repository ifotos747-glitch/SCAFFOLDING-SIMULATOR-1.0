name: Build SCAFFOLDING SIMULATOR
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          rm godot.zip
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/godot-templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Import and smoke test
        run: |
          godot --headless --editor --path . --import
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/game.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/game.log; then exit 1; fi
        shell: bash
      - name: Export Windows
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" dist/SCAFFOLDING-SIMULATOR.exe
          test -s dist/SCAFFOLDING-SIMULATOR.exe
      - name: Create Windows installer
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis installer.nsi
          test -s dist/SCAFFOLDING-SIMULATOR-4.0-SETUP.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SCAFFOLDING-SIMULATOR-4.0-WINDOWS
          path: dist/
          if-no-files-found: error
